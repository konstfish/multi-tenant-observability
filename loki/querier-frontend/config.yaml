apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-kube-rbac-proxy
data:
  config.yaml: |+
    authorization:
      rewrites:
        byHttpHeader:
          name: "X-Scope-OrgID"
      resourceAttributes:
        apiVersion: v1
        resource: pods
        subresource: logs
        namespace: "{{ .Value }}"