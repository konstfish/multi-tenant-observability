apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: alloy
  namespace: monitoring
spec:
  chart: alloy
  repo: https://grafana.github.io/helm-charts
  targetNamespace: monitoring
  version: 0.12.3
  valuesContent: |-
    controller:
      type: daemonset

    serviceMonitor:
      enabled: true

    mounts:
      varlog: false
      dockercontainers: true

    alloy:
      configMap:
        create: true
        content: |
          // discover all pods
          discovery.kubernetes "pod" {
            role = "pod"
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pod.targets

            // only scrape logs from pods with logging enabled label
            rule {
              source_labels = ["__meta_kubernetes_pod_label_logging"]
              regex = "enabled"
              action = "keep"
            }

            // append additional labels
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              action = "replace"
              target_label = "node_name"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              action = "replace"
              target_label = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
              action = "replace"
              target_label = "job"
              separator = "/"
              replacement = "$1"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              action = "replace"
              target_label = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              action = "replace"
              target_label = "container"
            }

            // log discovery rules
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              action = "replace"
              target_label = "__path__"
              separator = "/"
              replacement = "/var/log/pods/*$1/*.log"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash", 
                               "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash", 
                               "__meta_kubernetes_pod_container_name"]
              action = "replace"
              target_label = "__path__"
              regex = "true/(.*)/(.*)"
              replacement = "/var/log/pods/*$1/*.log"
            }
          }

          // endpoint of our log ingester
          loki.write "default" {
            endpoint {
              url = "http://loki-gateway/loki/api/v1/push"
            }
          }

          // forwarding pipeline
          loki.source.kubernetes "pod_logs" {
            targets = discovery.relabel.pod_logs.output
            forward_to = [loki.process.pod_logs.receiver]
          }

          // required for multi-tenancy, we need to tell Loki which tenant the log line belongs to
          // to achieve this, we add a tenant label, setting the content to the name of the
          // originating namespace. Loki will interpret this for us and store the line accordingly
          loki.process "pod_logs" {
            stage.cri {}

            // extract namespace name & set as tenant label
            stage.match {
              selector = "{namespace=~\".+\"}"
              stage.tenant {
                label = "namespace"
              }
            }

            forward_to = [loki.write.default.receiver]
          }